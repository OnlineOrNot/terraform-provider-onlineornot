name: Sync API SDK Schema Lock

on:
  schedule:
    - cron: '0 0 * * *'  # Run daily at midnight UTC
  workflow_dispatch:  # Allow manual trigger

permissions:
  contents: write
  pull-requests: write

jobs:
  sync-schemas:
    name: Sync API SDK schema lock
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Sync schema lock from the API SDK
        run: |
          curl --fail --silent --show-error --location \
            https://raw.githubusercontent.com/OnlineOrNot/onlineornot/main/packages/api/schema.lock.json \
            --output schema.lock.json
          make generate

      - name: Create PR if changed
        run: |
          if git diff --quiet; then
            echo "No changes detected"
            exit 0
          fi

          BRANCH="sync-api-sdk-schema-lock"
          
          # Check if PR already exists
          EXISTING_PR=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number')
          if [ -n "$EXISTING_PR" ]; then
            echo "PR #$EXISTING_PR already exists, updating..."
          fi

          # Configure git
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Create/update branch
          git checkout -B "$BRANCH"
          git add -A
          git commit -m "chore: sync API SDK schema lock"
          git push -f origin "$BRANCH"

          # Create PR if it doesn't exist
          if [ -z "$EXISTING_PR" ]; then
            gh pr create \
              --title "chore: sync API SDK schema lock" \
              --body 'Automated PR to sync the provider with the OpenAPI revision pinned by `@onlineornot/api`. New operations must be classified in `operation-parity.json`.'
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
